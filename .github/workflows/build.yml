name: Build postmarketOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: postmarketos/pmaports:latest
    
    steps:
      - name: Build postmarketOS
        run: |
          pmbootstrap init --device=samsung-a2corelte --ui=none --password=12345678
          pmbootstrap install --no-fde
          pmbootstrap export

      - name: Prepare artifacts
        run: |
          mkdir -p /tmp/artifacts
          cp -r /tmp/postmarketOS-export/* /tmp/artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-a2corelte
          path: /tmp/artifacts/
