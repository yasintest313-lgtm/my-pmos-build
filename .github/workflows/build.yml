name: Build postmarketOS
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv git
      - name: Clone pmbootstrap
        run: git clone https://gitlab.com/postmarketOS/pmbootstrap.git
      - name: Build
        run: |
          cd pmbootstrap
          echo -e "samsung-a2corelte\nnone\nn\nn\n" | python3 pmbootstrap.py init
          python3 pmbootstrap.py install --password 12345678 --no-fde
      - name: Export
        run: |
          cd pmbootstrap
